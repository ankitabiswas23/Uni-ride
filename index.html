<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni Ride Tracker</title>
<style>
:root{--bg:#fbfaf3;--grid:#e4e2d4;--ink:#111;--card:#fff;--y:#ffd93d;--p:#ff8fab;--m:#7ee8b0;--b:#8ecbff;--sh:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1f;--grid:#2c2c33;--ink:#f4f4f0;--card:#26262c;--sh:#000}}
:root[data-theme="dark"]{--bg:#1b1b1f;--grid:#2c2c33;--ink:#f4f4f0;--card:#26262c;--sh:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:28px 28px;font-family:"Arial Black","Archivo Black",Impact,system-ui,sans-serif;font-weight:800;min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 40px}
.box{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--sh);padding:14px;margin-bottom:16px}
h1{font-size:26px;margin:0;line-height:1;text-transform:uppercase;letter-spacing:-1px}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.tag{background:var(--y);color:#111;border:3px solid var(--ink);padding:2px 8px;font-size:12px;display:inline-block;transform:rotate(-2deg)}
button{font:inherit;color:#111;cursor:pointer;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--sh);background:var(--card);color:var(--ink);padding:10px 12px;font-size:14px;text-transform:uppercase}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--sh)}
.row{display:flex;gap:8px}.row>*{flex:1}
.who button.on{background:var(--p);color:#111}
.leg button.on{background:var(--b);color:#111}
#go{width:100%;background:var(--m);color:#111;font-size:20px;padding:20px 10px;margin-top:14px;line-height:1.15}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:3px solid var(--ink);padding:8px;background:var(--y);color:#111}
.stat small{display:block;font-size:11px;text-transform:uppercase}.stat b{font-size:24px}
.stat.alt{background:var(--b)}
.ride{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);padding:10px;margin-bottom:10px;background:var(--card);box-shadow:3px 3px 0 var(--sh)}
.ride .ic{font-size:24px}.ride .mid{flex:1;min-width:0}.ride .dt{font-size:14px}.ride .sub{font-size:12px;opacity:.75;font-weight:700}
.ride .fare{font-size:18px}
.pill{display:inline-block;border:2px solid var(--ink);padding:0 6px;font-size:12px;background:var(--p);color:#111;margin-right:4px}
.pill.Both{background:var(--y)}.pill.Arpita{background:var(--b)}
.x{padding:2px 8px;box-shadow:2px 2px 0 var(--sh);font-size:12px}
.empty{text-align:center;padding:18px;border:3px dashed var(--ink);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th,td{border:2px solid var(--ink);padding:6px;text-align:left}th{background:var(--y);color:#111}
.sign{display:flex;gap:16px;margin-top:34px;font-size:12px}.sign div{flex:1;border-top:3px solid var(--ink);padding-top:4px;text-align:center}
.banner{background:var(--p);color:#111;border:3px solid var(--ink);padding:8px 10px;margin-bottom:16px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(0);background:var(--ink);color:var(--bg);padding:10px 16px;border:3px solid var(--ink);transition:.2s;z-index:9}
#toast.s{transform:translateX(-50%) scale(1)}
.inp{width:100%;font:inherit;font-weight:700;font-size:13px;border:3px solid var(--ink);padding:10px;background:var(--card);color:var(--ink);margin:8px 0}
.hid{display:none}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.box{box-shadow:none}.wrap{padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top noprint">
    <div><h1>Uni Ride 🏍️</h1><span class="tag" id="mon"></span></div>
    <button id="th" aria-label="Toggle theme">◐</button>
  </div>
  <div id="banner" class="banner hid noprint"></div>

  <div class="box noprint">
    <h2>1 · Who rode?</h2>
    <div class="row who" id="who"></div>
    <h2 style="margin-top:14px">2 · Which trip?</h2>
    <div class="row leg" id="leg">
      <button data-v="AM">🌅 Morning</button><button data-v="PM">🌇 Evening</button>
    </div>
    <button id="go"></button>
  </div>

  <div class="box noprint">
    <h2>This month so far</h2>
    <div class="stats">
      <div class="stat"><small>Total bill</small><b id="tot">₹0</b></div>
      <div class="stat alt"><small>Rides</small><b id="cnt">0</b></div>
    </div>
  </div>

  <div class="noprint">
    <h2 style="padding:0 4px">🧾 Ride log</h2>
    <div id="log"></div>
  </div>

  <div class="box" id="rep">
    <div class="noprint row" id="rtabs" style="margin-bottom:10px">
      <button data-v="w">Week</button><button data-v="f">Fortnight</button><button data-v="m">Month</button>
    </div>
    <h2>📄 Ride report</h2>
    <div id="rbody"></div>
    <div class="sign"><div>Driver’s sign</div><div>Payer’s sign</div></div>
    <div class="row noprint" style="margin-top:16px">
      <button id="cp">Copy</button><button id="pr">Print / PDF</button>
    </div>
  </div>
<div class="noprint" id="sstat" style="text-align:center;font-size:12px;margin-top:-4px"></div>
</div>
<div id="toast"></div>

<script>
// ---- Settings: change names / fares here ----
var NAMES=["Ankita","Arpita"], SOLO=70, BOTH=110, KEY="uniRideTracker.v1";
var $=function(i){return document.getElementById(i)};
var who="", leg=new Date().getHours()<14?"AM":"PM", range="m", S;

function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||!Array.isArray(S.rides))S={month:mk(new Date()),rides:[],last:null};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function fare(w){return w==="Both"?BOTH:SOLO}
function sum(a){return a.reduce(function(s,r){return s+r.fare},0)}
function mName(k){var p=k.split("-");return new Date(p[0],p[1]-1,1).toLocaleString("en-IN",{month:"long",year:"numeric"})}

// monthly auto-reset: old rides are cleared, only last month's total is kept
function rollover(){var k=mk(new Date());
  if(S.month!==k){if(S.rides.length)S.last={month:S.month,total:sum(S.rides),count:S.rides.length};
    S.month=k;S.rides=[];save();}}

var SYNC=""; // 👈 PASTE your Firebase database URL between these quotes
function base(){return SYNC.replace(/\/+$/,"")}
function api(path,m,body){return fetch(base()+path+".json",{method:m||"GET",body:body?JSON.stringify(body):undefined}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function stat(t){$("sstat").textContent=t}
function push(){if(!SYNC)return Promise.resolve();
  var p=S.rides.filter(function(r){return r.p});
  return Promise.all(p.map(function(r){var c={id:r.id,t:r.t,who:r.who,leg:r.leg,fare:r.fare};
    return api("/rides/"+S.month+"/"+r.id,"PUT",c).then(function(){delete r.p})}))
  .then(function(){save()}).catch(function(){stat("⚠️ Offline – will sync later")})}
function rdel(id){if(SYNC)api("/rides/"+S.month+"/"+id,"DELETE").catch(function(){toast("Offline – delete may come back")})}
function sync(){if(!SYNC)return;
  push().then(function(){return api("/rides")}).then(function(d){d=d||{};
    var keys=Object.keys(d).sort(),cur=d[S.month]||{};
    var pend=S.rides.filter(function(r){return r.p});
    S.rides=Object.keys(cur).map(function(k){return cur[k]}).concat(pend).sort(function(a,b){return a.id-b.id});
    var pv=keys.filter(function(k){return k<S.month}).pop();
    if(pv){var rs=Object.keys(d[pv]).map(function(k){return d[pv][k]});S.last={month:pv,total:sum(rs),count:rs.length}}
    keys.forEach(function(k){if(k<S.month&&k!==pv)api("/rides/"+k,"DELETE").catch(function(){})});
    save();all();stat("✅ Synced "+new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}))})
  .catch(function(){stat("⚠️ Can’t reach database – check the URL")})}
function initSync(){
  stat(SYNC?"Connecting…":"⚠️ Setup needed: paste your database URL in the script");
  sync();setInterval(sync,20000);document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()})}

function ding(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),t=c.currentTime,u=.13;
  function tone(f,s,d,ty,v){var o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;
    g.gain.setValueAtTime(v,t+s*u);g.gain.exponentialRampToValueAtTime(.001,t+(s+d)*u);
    o.connect(g);g.connect(c.destination);o.start(t+s*u);o.stop(t+(s+d)*u+.02)}
  function kick(s){var o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t+s*u);
    o.frequency.exponentialRampToValueAtTime(40,t+s*u+.12);g.gain.setValueAtTime(.5,t+s*u);
    g.gain.exponentialRampToValueAtTime(.001,t+s*u+.15);o.connect(g);g.connect(c.destination);o.start(t+s*u);o.stop(t+s*u+.16)}
  function hat(s){var n=c.createBuffer(1,2205,44100),d=n.getChannelData(0),i;for(i=0;i<2205;i++)d[i]=Math.random()*2-1;
    var b=c.createBufferSource(),g=c.createGain();b.buffer=n;g.gain.setValueAtTime(.12,t+s*u);
    g.gain.exponentialRampToValueAtTime(.001,t+s*u+.05);b.connect(g);g.connect(c.destination);b.start(t+s*u)}
  [[659,0,1],[784,1,1],[880,2,1],[784,3,1],[1047,4,2],[880,6,1],[1047,7,1],[1319,8,4]].forEach(function(n){tone(n[0],n[1],n[2]+.6,"square",.12)});
  [0,2,4,6,8].forEach(kick);[1,3,5,7,9].forEach(hat);
  tone(330,8,4,"triangle",.2)}catch(e){}}

function toast(t){var e=$("toast");e.textContent=t;e.className="s";setTimeout(function(){e.className=""},1600)}
function fmt(iso){var d=new Date(iso);return{
  d:d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}),
  t:d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true})}}

function drawControls(){
  $("who").innerHTML=NAMES.concat("Both").map(function(n){
    return '<button data-v="'+n+'" class="'+(who===n?"on":"")+'">'+n+'</button>'}).join("");
  [].forEach.call($("leg").children,function(b){b.className=b.dataset.v===leg?"on":""});
  $("go").textContent=leg==="AM"?"🎓 I’VE REACHED THE UNIVERSITY!":"🏠 I’VE REACHED HOME!";
  [].forEach.call($("rtabs").children,function(b){b.className=b.dataset.v===range?"on":""});
  $("rtabs").style.cssText="margin-bottom:10px";
}

function drawLog(){
  $("mon").textContent=mName(S.month);
  $("tot").textContent="₹"+sum(S.rides);$("cnt").textContent=S.rides.length;
  var b=$("banner");
  if(S.last){b.className="banner noprint";b.textContent="📌 "+mName(S.last.month)+": "+S.last.count+" rides · ₹"+S.last.total+" (history cleared)";}
  else b.className="banner hid";
  if(!S.rides.length){$("log").innerHTML='<div class="empty">No rides yet this month.<br>Tap the big green button after you arrive! 👆</div>';return}
  $("log").innerHTML=S.rides.slice().reverse().map(function(r){var f=fmt(r.t);
    return '<div class="ride"><div class="ic">'+(r.leg==="AM"?"🌅":"🌇")+'</div><div class="mid"><div class="dt">'+f.d+' · '+f.t+
    '</div><div class="sub"><span class="pill '+r.who+'">'+r.who+'</span>'+(r.leg==="AM"?"To university":"To home")+
    '</div></div><div class="fare">₹'+r.fare+'</div><button class="x" data-del="'+r.id+'">✕</button></div>'}).join("");
}

function inRange(){var n=new Date(),y=n.getFullYear(),m=n.getMonth(),lo,hi,lbl;
  if(range==="w"){var dw=(n.getDay()+6)%7;lo=new Date(y,m,n.getDate()-dw);hi=new Date(y,m,n.getDate()-dw+7);lbl="This week"}
  else if(range==="f"){var first=n.getDate()<=15;lo=new Date(y,m,first?1:16);hi=first?new Date(y,m,16):new Date(y,m+1,1);lbl=first?"1st – 15th":"16th – end of month"}
  else{lo=new Date(y,m,1);hi=new Date(y,m+1,1);lbl=mName(S.month)}
  return{rows:S.rides.filter(function(r){var t=new Date(r.t);return t>=lo&&t<hi}),lbl:lbl,lo:lo,hi:hi}}

var lastText="";
function drawReport(){var R=inRange(),rows=R.rows;
  var share={};NAMES.forEach(function(n){share[n]=0});
  var cnt={Ankita:0,Arpita:0,Both:0};NAMES.concat("Both").forEach(function(n){cnt[n]=0});
  rows.forEach(function(r){cnt[r.who]++;
    if(r.who==="Both")NAMES.forEach(function(n){share[n]+=r.fare/2});else share[r.who]+=r.fare});
  var total=sum(rows);
  var h='<div class="tag" style="margin-bottom:8px">'+R.lbl+'</div><table><tr><th>Who</th><th>Rides</th><th>₹</th></tr>';
  NAMES.concat("Both").forEach(function(n){h+='<tr><td>'+n+'</td><td>'+cnt[n]+'</td><td>'+sum(rows.filter(function(r){return r.who===n}))+'</td></tr>'});
  h+='<tr><th>Total</th><th>'+rows.length+'</th><th>₹'+total+'</th></tr></table>';
  h+='<table><tr><th colspan="2">Each person owes (both-rides split 50/50)</th></tr>'+
    NAMES.map(function(n){return '<tr><td>'+n+'</td><td>₹'+share[n]+'</td></tr>'}).join("")+'</table>';
  if(rows.length){h+='<table><tr><th>Date</th><th>Time</th><th>Who</th><th>₹</th></tr>'+rows.map(function(r){var f=fmt(r.t);
    return '<tr><td>'+f.d+'</td><td>'+f.t+(r.leg==="AM"?" 🌅":" 🌇")+'</td><td>'+r.who+'</td><td>'+r.fare+'</td></tr>'}).join("")+'</table>'}
  $("rbody").innerHTML=h;
  lastText="Ride report – "+R.lbl+"\n"+NAMES.concat("Both").map(function(n){return n+": "+cnt[n]+" rides"}).join("\n")+
    "\nTotal: ₹"+total+"\n"+NAMES.map(function(n){return n+" owes ₹"+share[n]}).join("\n");
}

function all(){drawControls();drawLog();drawReport()}

document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
  if(t.closest("#who")){who=t.dataset.v;drawControls()}
  else if(t.closest("#leg")){leg=t.dataset.v;drawControls()}
  else if(t.closest("#rtabs")){range=t.dataset.v;drawControls();drawReport()}
  else if(t.id==="go"){
    if(!who){toast("Pick who rode first! 👆");return}
    rollover();
    S.rides.push({id:Date.now(),t:new Date().toISOString(),who:who,leg:leg,fare:fare(who),p:1});
    save();all();push();ding();toast("Logged! "+who+" · ₹"+fare(who)+" 🎉");
    if(navigator.vibrate)navigator.vibrate(60);
  }
  else if(t.dataset.del){if(confirm("Delete this ride?")){S.rides=S.rides.filter(function(r){return String(r.id)!==t.dataset.del});save();all();rdel(t.dataset.del)}}
  else if(t.id==="cp"){var done=function(){toast("Copied 📋")};
    if(navigator.clipboard)navigator.clipboard.writeText(lastText).then(done,function(){toast("Copy failed")});else toast("Copy not supported")}
  else if(t.id==="pr"){window.print()}
  
  else if(t.id==="th"){var r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()==="#1b1b1f";
    r.setAttribute("data-theme",dk?"light":"dark")}
});

load();rollover();all();initSync();
</script>
</body>
</html>
